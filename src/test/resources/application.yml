# Test-only config: in-memory H2 so @QuarkusTest never touches ./data/.
# Overrides the same keys in src/main/resources/application.yml.
quarkus:
  datasource:
    db-kind: h2
    jdbc:
      url: "jdbc:h2:mem:llmlab-test;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
    devservices:
      enabled: false
  hibernate:
    orm:
      ddl-auto: none
  liquibase:
    change-log: "db/changelog/db.changelog-master.yaml"
    migrate-at-start: true
# LLM defaults for tests (deterministic, independent of the working-directory .env).
# api-key is intentionally unset (local servers need no key).
llm:
  provider: OPENAI_COMPATIBLE
  base-url: "http://localhost:11000/v1"
  model-name: "Qwen3.8-27B-UD-IQ3_S.gguf"
